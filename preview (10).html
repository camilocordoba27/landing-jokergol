<!DOCTYPE html>
<html lang="es">

<style>
  :root {
    --bg-main-notification: #0b0e14;
    --bg-card-notification: #161a21;
    --text-white-notification-notification: #ffffff;
    --text-gray-notification: #9ca3af;
    --accent-green: #4ade80;
  }

  body {
    background-color: var(--bg-main-notification);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
  }

  #notification-container {
    position: fixed;
    bottom: 20px;
    /* Separación del borde inferior */
    left: 20px;
    /* Separación del borde izquierdo */
    z-index: 9999;
  }

  .popup-notif {
    background-color: var(--bg-card-notification);
    border: 1px solid #2d343f;
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 320px;
    max-width: 400px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    transform: translateX(-120%);
    /* Empieza fuera de la pantalla */
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .popup-notif.show {
    transform: translateX(0);
    /* Entra a la pantalla */
  }

  /* El recuadro oscuro que contiene los iconos */
  .icon-box {
    background: #232a35;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    /* Para posicionar el logo del banco */
  }

  /* Estilos para el logo del banco */
  .bank-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* Asegura que el logo se vea completo sin estirarse */
    border-radius: 8px;
    /* Bordes redondeados sutiles */
    display: block;
  }

  .notif-content {
    flex-grow: 1;
  }

  .notif-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
  }

  .notif-header h4 {
    color: var(--text-white-notification-notification);
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }

  .check-icon {
    color: var(--accent-green);
    font-size: 14px;
  }

  .notif-body {
    color: var(--text-gray-notification);
    font-size: 13px;
    margin-top: 2px;
  }

  .notif-body b {
    color: #f3f4f6;
  }

  .close-btn {
    color: var(--text-gray-notification);
    cursor: pointer;
    font-size: 18px;
    padding: 0 5px;
    transition: color 0.2s;
    user-select: none;
  }

  .close-btn:hover {
    color: var(--text-white-notification-notification);
  }

  /* RESPONSIVO: Adaptación para celulares */
  @media (max-width: 480px) {
    #notification-container {
      left: 10px;
      right: 10px;
      bottom: 10px;
    }

    .popup-notif {
      width: auto;
      min-width: unset;
      gap: 10px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
    }
  }
</style>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificación Dinámica</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="notification-container"></div>

  <script>

    // === DATOS ALEATORIOS PARA LA NOTIFICACIÓN ===
    const nombres = [
      "Catalina Araya", "Marco Torres", "Javiera Paz", "Diego M.",
      "Elena R.", "Bastián Soto", "Ignacio V.", "Valentina G.", "Leo F.",
      "Roberto G.",  "Julio C.",
    ];

    const ciudades = [
      "Rancagua", "Santiago", "Viña del Mar", "Concepción",
      "Antofagasta", "La Serena", "Temuco"
    ];

    // URLs de logos de bancos populares en Chile
    const bancos = [
      { nombre: "BancoEstado", logo: "img/mach.svg" },
      { nombre: "Santander", logo: "img/skrill.png" },
      { nombre: "Bci", logo: "img/webpay.svg" },
      { nombre: "Banco de Chile", logo: "img/bt_clp.svg" }
    ];

    // === FUNCIÓN PARA GENERAR EL MONTO ===
    function generarMonto() {
      const monto = Math.floor(Math.random() * (2500000 - 50000 + 1)) + 50000;
      return monto.toLocaleString('es-CL');
    }

    // === FUNCIÓN PRINCIPAL PARA CREAR LA NOTIFICACIÓN ===
    function crearNotificacion() {
      const container = document.getElementById('notification-container');

      // Elegimos datos al azar
      const nombre = nombres[Math.floor(Math.random() * nombres.length)];
      const ciudad = ciudades[Math.floor(Math.random() * ciudades.length)];
      const monto = generarMonto();
      const banco = bancos[Math.floor(Math.random() * bancos.length)]; // Banco aleatorio

      // Generamos un ID único para poder controlarla
      const notifId = `notif-${Date.now()}`;

      // Estructura del HTML (Inyectada dinámicamente)
      const html = `
        <div class="popup-notif" id="${notifId}">
            <div class="icon-box">
                <img src="${banco.logo}" alt="${banco.nombre}" class="bank-logo">
            </div>
            <div class="notif-content">
                <div class="notif-header">
                    <h4>Retiro aprobado</h4>
                    <span class="check-icon">✅</span>
                </div>
                <div class="notif-body">
                    ${nombre} retiró <b>${monto} CLP</b> · ${ciudad}
                </div>
            </div>
            <div class="close-btn" onclick="cerrarNotif('${notifId}')">×</div>
        </div>
    `;

      container.innerHTML = html;

      setTimeout(() => {
        document.getElementById(notifId).classList.add('show');
      }, 100);

      setTimeout(() => {
        cerrarNotif(notifId);
      }, 6000);
    }

    function cerrarNotif(id) {
      const notif = document.getElementById(id);
      if (notif) {
        notif.classList.remove('show'); // Inicia animación de salida
        setTimeout(() => {
          notif.remove();
        }, 500);
      }
    }

    // === BUCLE INFINITO DE NOTIFICACIONES ===
    function loopNotificaciones() {
      const tiempoAleatorio = Math.floor(Math.random() * (18000 - 8000 + 1)) + 8000;

      setTimeout(() => {
        crearNotificacion(); // Crea la notificación actual
        loopNotificaciones(); // Se llama a sí misma para crear el bucle
      }, tiempoAleatorio);
    }

    // === INICIO DEL CICLO ===
    setTimeout(crearNotificacion, 2000);
    loopNotificaciones();
  </script>
</body>

</html>
